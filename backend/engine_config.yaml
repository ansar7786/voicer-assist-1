# Engine weights, thresholds, and hierarchy for deterministic pathway ranking
version: 1.0

# Ranking factor weights (must sum to 1.00)
weights:
  interest_match: 0.30
  skill_match: 0.25
  education_fit: 0.15
  duration_fit: 0.10
  local_demand: 0.10
  asset_fit: 0.10

thresholds:
  max_pathways: 3
  direct_skill_score: 1.0
  adjacent_skill_score: 0.6
  unmatched_skill_score: 0.0

# Education order hierarchy for hard filters and scoring
education_levels:
  none: 0
  primary: 1
  8th: 2
  10th: 3
  12th: 4
  ITI: 5
  graduate: 6

# Factor label thresholds
factor_labels:
  high_threshold: 0.70
  medium_threshold: 0.40
